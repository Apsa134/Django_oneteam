{% extends 'base.html' %} 
{%block title%}Login{% endblock %}



<div class="container">

    <div class="form-container">

        <h1>Welcome Back</h1>

        <p class="form-subtitle">Login to your account</p>

        <form method="post" action="{% url 'credentials:login' %}">

            {% csrf_token %}

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="passwd" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{% url 'credentials:register' %}">Register</a>
        </p>

    </div>

</div>

{% endblock %}
