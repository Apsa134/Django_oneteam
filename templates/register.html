{% extends 'base.html' %} 
{%block title%}Register{% endblock %}



<div class="container">

    <div class="form-container">

        <h1>Create Account</h1>

        <p class="form-subtitle">Register a new account</p>

        <form method="post" action="{% url 'credentials:register' %}">

            {% csrf_token %}

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="Enter first name" required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="Enter last name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Create Password</label>
                <input type="password" name="passwrd" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="con_passwrd" placeholder="Confirm password" required>
            </div>

            <button type="submit">Register</button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{% url 'credentials:login' %}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
