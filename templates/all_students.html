{% extends 'base.html' %} 
{%block title%}All Students{% endblock %}

<div class="container">

    <h1>All Students</h1>

    <h2 class="course-title">{{ my_course }}</h2>

    <div class="student-list">

        {% for i in all_stud %}

            <div class="student-card">
                {{ i.std_name }}
            </div>

        {% empty %}

            <p class="empty-message">No students found.</p>

        {% endfor %}

    </div>

</div>

{% endblock %}
